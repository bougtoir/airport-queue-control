base_config: configs/default.yaml
load_regimes: [0.85, 0.95]
replications: 10
seed_base: 410000
maximum_workers: 2

layouts:
  B1:
    barrier_footprint_m2: 10.0
    release_staff_count: 2
    gate_delay_seconds: 1.50
  B2:
    barrier_footprint_m2: 9.0
    release_staff_count: 0
    gate_delay_seconds: 0.35
  B3:
    barrier_footprint_m2: 3.0
    release_staff_count: 1
    gate_delay_seconds: 0.10
  B4:
    barrier_footprint_m2: 7.0
    release_staff_count: 1
    gate_delay_seconds: 0.50

row_angles_degrees: [0, 15, 30, 45]
policies:
  S1:
    batch_sizes: [8, 12, 16]
  S2:
    sub_batch_sizes: [2, 4, 6]
  S3:
    batch_sizes: [8, 12, 16]
    downstream_thresholds: [2, 6, 10]
  S4:
    batch_sizes: [8, 12, 16]

constraints:
  throughput_relative_margin: 0.02
  mean_wait_multiplier: 1.25
  mean_wait_additive_seconds: 30.0
  maximum_density_exceedance_fraction: 0.05

pareto_objectives:
  minimize:
    - mean_movement_starts
    - mean_movement_stops
    - mean_turning_angle_degrees
    - mean_movement_distance_m
    - mean_wait_seconds
    - required_waiting_area_m2_at_density_limit
  maximize:
    - throughput_per_hour
