[build-system]
requires = ["setuptools>=68,<76", "wheel>=0.41,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "airport-batch-queue"
version = "0.1.0"
description = "Reproducible simulation of stationary batch-release control for airport security queues"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.7,<4",
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "python-docx>=1.1,<2",
  "python-pptx>=0.6.23,<2",
  "PyYAML>=6,<7",
  "scipy>=1.10,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
airport-batch-queue = "airport_batch_queue.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
